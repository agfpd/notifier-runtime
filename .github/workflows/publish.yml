name: Publish

# Publishes @agfpd/notifier-runtime to npm via trusted publishing (OIDC) — no stored
# token, no OTP, no browser 2FA. Mirrors the foundation's publish.yml. Triggered by a
# version tag (v*); the manual dispatch re-publishes an EXISTING tag (the workflow
# runs from main and checks the tag out). npmjs.com trusted-publisher config must name
# this file: agfpd / notifier-runtime / publish.yml.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to publish (e.g. v0.5.1)'
        required: true

permissions:
  id-token: write # OIDC for npm trusted publishing
  contents: read

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # never cache in release builds
      - run: npm install -g npm@latest # trusted publishing needs npm >= 11.5.1
      - name: Tag matches package.json version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          ver="v$(node -p "require('./package.json').version")"
          [ "$tag" = "$ver" ] || { echo "tag $tag != package.json $ver" >&2; exit 1; }
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run typecheck
      - run: npm publish
